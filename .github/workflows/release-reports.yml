name: Release reports
on:
  push:
    branches: [main]
    paths: ['lists/*.json']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imightbemeteor/meteoric-modlist-tools@v1
        with:
          pages-url: https://skrubbyskrubinashrub.github.io/nordic-souls-PBR/
